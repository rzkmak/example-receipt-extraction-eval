# Sandbox infrastructure for example-receipt-extraction-eval.
#
#   Phoenix        -> trace UI & OTLP collector   http://localhost:6006  (gRPC :4317, HTTP :4318)
#   Dokimos Server -> eval run comparison UI      http://localhost:8080
#
# Start everything:   docker compose up -d
# Extractor runs on   http://localhost:8081  (Spring Boot app, run separately via ./mvnw spring-boot:run)
services:
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"   # Phoenix web UI
      - "4317:4317"   # OTLP gRPC collector (app exports via HTTP :4318 since Boot 4)
      - "4318:4318"   # OTLP HTTP collector (not served by this Phoenix image —
                      # it serves OTLP/HTTP on :6006/v1/traces instead)

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dokimos
      POSTGRES_USER: dokimos
      POSTGRES_PASSWORD: dokimos
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dokimos -d dokimos"]
      interval: 5s
      timeout: 5s
      retries: 5

  dokimos-server:
    image: ghcr.io/dokimos-dev/dokimos-server:latest
    ports:
      - "8080:8080"   # Dokimos web UI
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: dokimos
      DB_USERNAME: dokimos
      DB_PASSWORD: dokimos
      # DOKIMOS_API_KEY: your-secret-key  # Uncomment to enable auth
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
