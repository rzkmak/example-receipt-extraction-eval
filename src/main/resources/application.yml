spring:
  application:
    name: example-receipt-extraction-eval
  ai:
    openai:
      # Placeholder default lets the context boot without a key (offline checks,
      # health endpoint); any real model call then fails loudly until you export
      # OPENAI_API_KEY.
      api-key: ${OPENAI_API_KEY:no-key-set}
      # Point at any OpenAI-compatible endpoint (Ollama, llama.cpp, vLLM...).
      # The client appends /v1/chat/completions, so use the bare host, e.g.
      # OPENAI_BASE_URL=http://localhost:11434
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        options:
          # Extractor model. Swap via env for Milestone 3 Experiment B,
          # e.g. EXTRACTOR_MODEL=qwen2.5:7b with a local Ollama/OpenAI-compatible base-url.
          model: ${EXTRACTOR_MODEL:glm-5.3-flash}
          temperature: 0.0
    # Put prompt & completion content on the chat spans so Phoenix shows
    # what the extractor actually saw and answered.
    # NOTE for image mode (/extract-image): the model may transcribe card
    # numbers etc. from the photo, so completion capture can carry PII into
    # telemetry. Set CHAT_COMPLETION_TELEMETRY=false for image-heavy
    # deployments; the text path stays fully scrubbed either way.
    chat:
      observations:
        include-prompt: true
        include-completion: ${CHAT_COMPLETION_TELEMETRY:true}
        include-error-logging: true

# Milestone 3 Experiment A: set RECEIPT_EXTRACTION_TAX_HINT=false to drop the
# "※ = 8% reduced tax" hint from the system prompt and watch the eval fail.
receipt:
  extraction:
    tax-hint: ${RECEIPT_TAX_HINT:true}
  observability:
    # Layer 6: experiment & prompt lineage stamped on every span.
    experiment-name: ${EXPERIMENT_NAME:Receipt Extractor Baseline}
    # Blank run-id -> generated per process (run-<UTC timestamp>).
    run-id: ${EXPERIMENT_RUN_ID:}
    prompt-template-id: bilingual-receipt-extractor
    prompt-template-version: ${PROMPT_TEMPLATE_VERSION:v1.3-split-tax-rules}
    # Layer 3: 1 model call + N-1 self-correction retries on malformed JSON.
    schema-max-attempts: ${SCHEMA_MAX_ATTEMPTS:2}
    # Layer 5: pre-inference PII scrubbing (card / member id / phone).
    pii-redaction-enabled: ${PII_REDACTION_ENABLED:true}
    # Layer 1: Phoenix span annotations (eval verdicts attached to spans).
    phoenix:
      annotations-enabled: ${PHOENIX_ANNOTATIONS_ENABLED:true}
      annotations-url: ${PHOENIX_URL:http://localhost:6006}
    # Layer 7: async judge auditing of high-risk live extractions.
    audit:
      enabled: ${DOKIMOS_AUDIT_ENABLED:false}
      url: ${DOKIMOS_SERVER_URL:http://localhost:8080}
      endpoint: /api/v1/high-risk-extractions
    # Layer 2: USD per million tokens (input, cached-input, output) per model.
    # The role tag on cost metrics keeps extractor vs judge spend separable,
    # even when both default to the same model.
    # NOTE: the glm-5.3-flash numbers are placeholders — verify them against
    # your provider's price sheet. Models without an entry here record $0
    # cost by design (the recorder refuses to guess).
    pricing:
      glm-5.3-flash:
        input-usd-per-million-tokens: 0.15
        cached-input-usd-per-million-tokens: 0.075
        output-usd-per-million-tokens: 0.60
      gpt-4o:
        input-usd-per-million-tokens: 2.50
        cached-input-usd-per-million-tokens: 1.25
        output-usd-per-million-tokens: 10.00

server:
  # 8080 belongs to the Dokimos server UI in the sandbox compose file.
  port: ${APP_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      # OTLP gRPC to the Phoenix collector (docker compose exposes 4317).
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
      transport: grpc

logging:
  level:
    org.springframework.ai: INFO
